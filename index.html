<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11131b">
  <meta name="description" content="Invitación digital de los 3 añitos de Camila Cruzalta Popoca. 2 de enero de 2027.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Fezoj Studio">
  <meta property="og:title" content="Mis 3 añitos de Camila Cruzalta Popoca">
  <meta property="og:description" content="Acompáñanos a celebrar los 3 añitos de Camila. ¡Abre su invitación!">
  <meta property="og:url" content="https://fezojdesing.github.io/Mis_3_Camila/">
  <meta property="og:image" content="https://fezojdesing.github.io/Mis_3_Camila/portadawhts.jpg">
  <meta property="og:image:secure_url" content="https://fezojdesing.github.io/Mis_3_Camila/portadawhts.jpg">
  <meta property="og:image:alt" content="Portada de la invitación de los 3 añitos de Camila Cruzalta Popoca">
  <meta property="og:image:type" content="image/jpeg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mis 3 añitos de Camila Cruzalta Popoca">
  <meta name="twitter:description" content="Acompáñanos a celebrar los 3 añitos de Camila. ¡Abre su invitación!">
  <meta name="twitter:image" content="https://fezojdesing.github.io/Mis_3_Camila/portadawhts.jpg">
  <title>Mis 3 añitos Camila Cruzalta Popoca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
  <style>
    :root{--cream:#fff5d7;--gold:#d5b45b;--blue:#344b60;--brown:#593b27}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:#80688f}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 12%,#c5a9d0 0,#ad91bd 42%,#967ba8 76%,#80688f 100%);color:var(--cream);font-family:'Cormorant Garamond',serif;overflow-x:hidden}
    button,a{-webkit-tap-highlight-color:transparent}
    .screen{width:100%;min-height:100vh;min-height:100svh;display:flex;justify-content:center;align-items:flex-start;padding:0 0 34px;position:relative;isolation:isolate}
    .screen[hidden]{display:none}
    .page{width:min(100%,625px);position:relative;overflow:hidden;box-shadow:0 18px 70px #0008;animation:pageIn .9s cubic-bezier(.2,.7,.2,1) both}
    .page-art{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
    @keyframes pageIn{from{opacity:0;transform:translateY(18px) scale(.992);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
    .hotspot{position:absolute;display:block;border:0;background:transparent;cursor:pointer;z-index:4;border-radius:999px;outline-offset:5px}
    .hotspot:focus-visible{outline:2px solid #fff2bd}
    .hotspot::after{content:"";position:absolute;inset:-5px;border-radius:inherit;box-shadow:0 0 0 0 #fff7;transition:box-shadow .3s,transform .3s}
    .hotspot:hover::after,.hotspot:focus-visible::after{box-shadow:0 0 24px 5px #fff9;transform:scale(1.035)}
    .hotspot:active{transform:scale(.96)}
    /* Coordenadas relativas a cada página: conservan intacta la composición del PDF. */
    .open-hit{left:27%;top:76.5%;width:46%;height:4.4%}
    .logo-cover-hit{left:36%;top:87.0%;width:28%;height:4.2%}
    .map-button{position:absolute;z-index:5;left:50%;transform:translateX(-50%);width:30%;min-height:42px;padding:8px 12px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,220,224,.9);border-radius:999px;background:linear-gradient(125deg,rgba(119,78,151,.97),rgba(205,132,169,.97) 56%,rgba(222,184,112,.97));color:#fff8f1;text-decoration:none;font-family:'Marcellus',serif;font-size:clamp(12px,3vw,16px);font-weight:500;letter-spacing:.025em;text-shadow:0 1px 3px #4b285c88;box-shadow:0 3px 14px #26142f88,inset 0 1px 0 #fff9;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);transition:transform .25s ease,box-shadow .25s ease,filter .25s ease}
    .map-button:hover,.map-button:focus-visible{transform:translateX(-50%) translateY(-2px) scale(1.045);box-shadow:0 6px 22px #d58abbaa,inset 0 1px 0 #fff;filter:brightness(1.07);outline:none}
    .map-button:active{transform:translateX(-50%) scale(.97)}
    .map-ceremony-hit{top:52.1%}
    .map-reception-hit{top:64.4%}
    @media(max-width:380px){.map-button{width:34%;min-height:39px;padding:7px 8px;font-size:13px;letter-spacing:.01em}}
    .logo-data-hit{left:37%;top:90.5%;width:26%;height:3.8%}
    .quote-button{position:absolute;z-index:6;left:50%;top:96.2%;transform:translateX(-50%);width:46%;max-width:260px;min-height:30px;padding:7px 12px;font-size:clamp(9px,2.4vw,14px);letter-spacing:.055em;border:1px solid rgba(255,222,220,.95);border-radius:999px;color:#fff8f2;background:linear-gradient(125deg,rgba(111,72,145,.98),rgba(198,119,161,.98) 58%,rgba(218,177,107,.98));text-shadow:0 1px 3px #4b285c88;box-shadow:0 4px 16px #26142f88,inset 0 1px 0 #fff9;text-align:center;white-space:nowrap}
    .quote-button:hover,.quote-button:focus-visible{transform:translateX(-50%) translateY(-2px) scale(1.035);box-shadow:0 7px 22px #d58abbaa;filter:brightness(1.08);outline:none}
    .quote-button:active{transform:translateX(-50%) scale(.97)}
    @media(max-width:380px){.quote-button{width:52%;min-height:28px;padding:6px 9px;font-size:10px}}
    .countdown{position:absolute;z-index:3;top:6.8%;left:7%;width:86%;text-align:center;color:#fff2ce;text-shadow:0 2px 9px #2c1708,0 0 16px #f6d78b99;pointer-events:none;animation:fadeUp 1.4s .25s both}
    .countdown-grid{display:flex;justify-content:center;gap:clamp(10px,3vw,22px)}
    .time-unit{min-width:clamp(48px,11vw,74px)}
    .time-number{display:block;font-size:clamp(35px,8.7vw,56px);line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
    .time-caption{display:block;margin-top:5px;font-family:'Marcellus',serif;font-size:clamp(9px,2.1vw,13px);letter-spacing:.1em;text-transform:uppercase}
    @media(max-width:380px){.countdown{top:6.6%;left:3%;width:94%}.countdown-grid{gap:clamp(5px,2vw,9px)}.time-unit{min-width:0;flex:1}.time-number{font-size:clamp(31px,8.6vw,40px)}.time-caption{font-size:clamp(7px,1.9vw,9px);letter-spacing:.06em}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .utility-button{position:relative;overflow:hidden;font-family:'Marcellus',serif;letter-spacing:.035em;border:1px solid rgba(255,255,255,.48);color:#fffafc;background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(239,220,250,.13) 42%,rgba(214,168,202,.2)),rgba(255,255,255,.12);border-radius:999px;padding:0;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 26px rgba(31,18,46,.22),inset 0 1px 0 rgba(255,255,255,.72),inset 0 -1px 0 rgba(255,255,255,.12);text-shadow:0 1px 4px rgba(47,28,59,.6);backdrop-filter:blur(22px) saturate(165%);-webkit-backdrop-filter:blur(22px) saturate(165%);transition:transform .28s,box-shadow .28s,background .28s,filter .28s}
    .utility-button::before{content:"";position:absolute;inset:1px;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.3),transparent 38%,rgba(255,255,255,.08) 72%,rgba(255,255,255,.2));pointer-events:none}
    .utility-button>*{position:relative}
    .utility-bar{position:fixed;z-index:20;left:12px;right:12px;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:9px;align-items:center;pointer-events:none}
    .utility-button{min-height:42px;padding:0 17px;pointer-events:auto;font-size:12px}
    #backToCover{width:auto;height:42px;min-width:78px;padding:0 16px;font-size:12px}
    #musicToggle{min-width:126px}
    .utility-button:hover{transform:translateY(-3px) scale(1.035);box-shadow:0 10px 30px rgba(239,194,225,.35),inset 0 1px 0 rgba(255,255,255,.82);background:linear-gradient(135deg,rgba(255,255,255,.46),rgba(239,220,250,.2) 42%,rgba(214,168,202,.28)),rgba(255,255,255,.16);filter:brightness(1.08)}
    .utility-button:active{transform:scale(.96)}
    @media(max-width:380px){#backToCover{min-width:72px;padding:0 13px}#musicToggle{min-width:116px;font-size:11px}}
    .utility-button:disabled{opacity:.45;cursor:not-allowed}
    .invitation-audio{display:none}
    .ambient{position:fixed;inset:0;z-index:8;overflow:hidden;pointer-events:none;isolation:isolate}
    .orb{position:absolute;width:clamp(100px,28vw,260px);aspect-ratio:1;border-radius:50%;filter:blur(42px);opacity:.23;background:radial-gradient(circle,#f0c9d9 0, #b99acb 38%,transparent 72%);animation:drift 13s ease-in-out infinite alternate}
    .orb:nth-child(1){top:9%;left:-9%}.orb:nth-child(2){top:45%;right:-12%;animation-delay:-5s;opacity:.14}.orb:nth-child(3){bottom:3%;left:22%;animation-delay:-8s;opacity:.12}
    @keyframes drift{from{transform:translate3d(-10px,-15px,0) scale(.9)}to{transform:translate3d(25px,35px,0) scale(1.18)}}
    .sparkle{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff1c6;box-shadow:0 0 13px 3px #f6d98a;opacity:0;animation:twinkle 5s linear infinite}
    .sparkle:nth-child(4){top:23%;left:18%;animation-delay:1s}.sparkle:nth-child(5){top:58%;right:16%;animation-delay:2.7s}.sparkle:nth-child(6){top:77%;left:72%;animation-delay:3.5s}
    @keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}45%{opacity:.8;transform:scale(1.4)}65%{opacity:.2;transform:scale(.7)}}
    /* Corazones flotantes en morado, rosa y dorado: reemplazan el bokeh circular. */
    .heart-float{position:absolute;display:block;font-style:normal;line-height:1;color:var(--heart-color,#d99ab9);font-size:clamp(22px,5vw,42px);opacity:0;text-shadow:0 0 7px currentColor,0 0 19px currentColor,0 2px 5px #160d25;filter:drop-shadow(0 0 5px currentColor);animation:heartDrift 13s ease-in-out infinite}
    .heart-float::before{content:"♥"}
    .heart-float:nth-child(7){--heart-color:#b995e6;left:8%;top:19%;font-size:42px;animation-delay:-2s}
    .heart-float:nth-child(8){--heart-color:#e6a0c3;left:79%;top:14%;font-size:30px;animation-delay:-7s}
    .heart-float:nth-child(9){--heart-color:#dfbd79;right:7%;top:48%;font-size:50px;animation-delay:-4s}
    .heart-float:nth-child(10){--heart-color:#d98bb4;left:17%;top:70%;font-size:36px;animation-delay:-9s}
    .heart-float:nth-child(11){--heart-color:#c5a0e9;right:23%;top:78%;font-size:27px;animation-delay:-5s}
    .heart-float:nth-child(12){--heart-color:#e1bd7e;left:43%;top:39%;font-size:40px;animation-delay:-11s}
    @keyframes heartDrift{0%,100%{opacity:0;transform:translate3d(0,18px,0) scale(.72) rotate(-12deg)}22%,72%{opacity:.72}48%{opacity:.3;transform:translate3d(12px,-24px,0) scale(1.12) rotate(10deg)}}
    .page-transition{position:fixed;inset:0;z-index:15;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(255,222,230,.34),transparent 38%),radial-gradient(circle at 22% 28%,rgba(208,165,225,.25),transparent 24%),radial-gradient(circle at 78% 70%,rgba(226,190,126,.22),transparent 28%)}
    .page-transition::before,.page-transition::after{content:"✧  ·  ✦  ·  ✧";position:absolute;left:50%;top:50%;color:#fff0c5;text-shadow:0 0 12px #e9c76d,0 0 28px #e9c76d;font-size:clamp(24px,7vw,54px);letter-spacing:.5em;white-space:nowrap;transform:translate(-50%,-50%) scale(.65);opacity:0}
    .page-transition::after{content:"·  ✧  ·";color:#c9d9ed;font-size:clamp(18px,5vw,38px);letter-spacing:.8em}
    .page-transition.active{animation:pageGlow .95s ease-out both}
    .page-transition.active::before{animation:starBurst .95s ease-out both}
    .page-transition.active::after{animation:starBurst .95s .08s ease-out both}
    @keyframes pageGlow{0%{opacity:0}22%{opacity:1}100%{opacity:0}}
    @keyframes starBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(-12deg);filter:blur(5px)}35%{opacity:.95;filter:blur(0)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.45) rotate(12deg);filter:blur(3px)}}
    @media(min-width:700px){.screen{padding-top:22px}.page,.after-page{border-radius:3px}.page-art{border-radius:3px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"><span class="orb"></span><span class="orb"></span><span class="orb"></span><i class="sparkle"></i><i class="sparkle"></i><i class="sparkle"></i><i class="heart-float"></i><i class="heart-float"></i><i class="heart-float"></i><i class="heart-float"></i><i class="heart-float"></i><i class="heart-float"></i></div>
  <div class="page-transition" id="pageTransition" aria-hidden="true"></div>

  <main>
    <section class="screen" id="coverScreen" aria-label="Portada">
      <div class="page" id="coverPage">
        <img class="page-art" src="portada_1.jpg" alt="Portada de la invitación de los 3 añitos de Camila Cruzalta Popoca">
        <button class="hotspot open-hit" id="openInvitation" aria-label="Toca para abrir la invitación"></button>
        <a class="hotspot logo-cover-hit" href="https://fezojdesing.github.io/fezoj_studio/" target="_blank" rel="noopener" aria-label="Visitar Fezoj Studio"></a>
      </div>
    </section>

    <section class="screen" id="dataScreen" aria-label="Datos" hidden>
      <div>
        <div class="page" id="dataPage">
          <img class="page-art" src="datos_1.jpg" alt="Datos de la celebración de Camila: padres, padrinos, ceremonia y recepción">
          <div class="countdown" aria-live="off">
              <div class="countdown-grid">
              <div class="time-unit"><span class="time-number" id="days">00</span><span class="time-caption">Días</span></div>
              <div class="time-unit"><span class="time-number" id="hours">00</span><span class="time-caption">Horas</span></div>
              <div class="time-unit"><span class="time-number" id="minutes">00</span><span class="time-caption">Minutos</span></div>
              <div class="time-unit"><span class="time-number" id="seconds">00</span><span class="time-caption">Segundos</span></div>
            </div>
          </div>
          <a class="map-button map-ceremony-hit" href="https://www.google.com/maps/search/?api=1&query=Parroquia+de+San+Pedro+Ap%C3%B3stol+Almoloya+de+Alquisiras+Estado+de+M%C3%A9xico" target="_blank" rel="noopener" aria-label="Ver mapa de la ceremonia">VER MAPAS</a>
          <a class="map-button map-reception-hit" href="https://www.google.com/maps/search/?api=1&query=El+Vivero+Almoloya+de+Alquisiras+Estado+de+M%C3%A9xico" target="_blank" rel="noopener" aria-label="Ver mapa de la recepción">VER MAPAS</a>
          <a class="hotspot logo-data-hit" href="https://fezojdesing.github.io/fezoj_studio/" target="_blank" rel="noopener" aria-label="Visitar Fezoj Studio"></a>
          <a class="quote-button" href="https://fezojdesing.github.io/fezoj_studio/contacto.html" target="_blank" rel="noopener">COTIZA TU INVITACIÓN</a>
        </div>
      </div>
    </section>
  </main>

  <div class="utility-bar" id="utilityBar" hidden>
    <button class="utility-button" id="backToCover" type="button" aria-label="Volver al inicio" title="Volver al inicio">Inicio</button>
    <button class="utility-button" id="musicToggle" type="button" aria-label="Pausar música" title="Pausar música">Pausar música</button>
  </div>
  <audio class="invitation-audio" id="invitationAudio" src="Musica.mp3" preload="auto" loop></audio>

  <script>
    (() => {
      const cover = document.getElementById('coverScreen');
      const data = document.getElementById('dataScreen');
      const openButton = document.getElementById('openInvitation');
      const musicButton = document.getElementById('musicToggle');
      const backButton = document.getElementById('backToCover');
      const utilityBar = document.getElementById('utilityBar');
      const pageTransition = document.getElementById('pageTransition');
      const invitationAudio = document.getElementById('invitationAudio');
      let playing = false;

      async function startMusicFromTap() {
        try {
          await invitationAudio.play();
          playing = true;
        } catch (error) {
          playing = false;
          console.warn('No se pudo iniciar la música:', error);
        }
        updateMusicButton();
      }
      function updateMusicButton(){
        musicButton.textContent = playing ? 'Pausar música' : 'Reproducir música';
        musicButton.setAttribute('aria-label', playing ? 'Pausar música' : 'Reproducir música');
        musicButton.setAttribute('title', playing ? 'Pausar música' : 'Reproducir música');
      }
      function playPageTransition(){
        pageTransition.classList.remove('active');
        void pageTransition.offsetWidth;
        pageTransition.classList.add('active');
      }
      function showData(){
        playPageTransition();
        cover.hidden = true;
        data.hidden = false;
        utilityBar.hidden = false;
        window.scrollTo({top:0,behavior:'smooth'});
        data.querySelector('.page').style.animation='none';
        requestAnimationFrame(()=>data.querySelector('.page').style.animation='');
      }
      openButton.addEventListener('click', () => {
        startMusicFromTap();
        opened = true;
        showData();
      });
      musicButton.addEventListener('click', async () => {
        if (invitationAudio.paused) {
          await startMusicFromTap();
        } else {
          invitationAudio.pause();
          playing = false;
          updateMusicButton();
        }
      });
      backButton.addEventListener('click', () => {
        playPageTransition();
        data.hidden = true;
        cover.hidden = false;
        utilityBar.hidden = true;
        window.scrollTo({top:0,behavior:'smooth'});
      });

      // La ceremonia comienza a las 2:00 PM, hora local de Almoloya de Alquisiras.
      const eventDate = new Date('2027-01-02T14:00:00-06:00').getTime();
      const pad = n => String(Math.max(0,n)).padStart(2,'0');
      function tick(){
        let diff = Math.max(0,eventDate-Date.now());
        const days = Math.floor(diff/86400000); diff %= 86400000;
        const hours = Math.floor(diff/3600000); diff %= 3600000;
        const minutes = Math.floor(diff/60000); diff %= 60000;
        const seconds = Math.floor(diff/1000);
        document.getElementById('days').textContent = pad(days);
        document.getElementById('hours').textContent = pad(hours);
        document.getElementById('minutes').textContent = pad(minutes);
        document.getElementById('seconds').textContent = pad(seconds);
      }
      tick();
      setInterval(tick,1000);
    })();
  </script>
</body>
</html>
